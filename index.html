<!DOCTYPE html>

<html>
    <head>
        <title>Cadastro de Usuário</title>
    </head>
    <body>
        <header>
            <h1 id="inicio">Cadastro de Usuário</h1>
            <nav>
                <ul>
                    <li><a href="#inicio">Início</a></li>
                    <li><a href="#cadastro">Cadastro</a></li>
                </ul>
            </nav>
        </header>

        <section id="cadastro">
            <h2>Formulário de Cadastro</h2>
            <form action="/enviar_dados" method="get">
                <label for="nome">Nome Completo: </label><br>
                <input type="text" id="nome" name="nome" required><br><br>

                <label for="email">E-mail: </label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="senha">Senha: </label><br>
                <input type="text" id="senha" name="senha" required><br><br>

                <label for="genero">Gênero: </label><br>
                <select id="genero" name="genero">
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="outro">Prefiro não informar</option>
                </select><br><br>

                <label for="interesses">Interesses: <br>
                    <input type="radio" name="programacao" value="programacao"> Programação <br>
                    <input type="radio" name="design" value="design"> Design <br>
                    <input type="radio" name="musica" value="musica"> Música <br>
                </label><br>

                <label for="biografia">Biografia: </label><br>
                <textarea id="biografia" name="biografia" rows="4" cols="50"></textarea><br><br>

                <input type="submit" id="send" value="Enviar"><br>

                <footer>
                    <p>© 2026 Cadastro de Usuário</p>
                </footer>

            </form> 
        </section>
    </body>
</html>
